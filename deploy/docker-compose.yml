services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883" # LAN-exposed, username/password auth, no TLS in Phase 1
    environment:
      # injected so the fake-node scripts (exec'd in-container) can authenticate
      MQTT_SERVER_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_SERVER_PASSWORD: ${MQTT_SERVER_PASSWORD}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./scripts:/scripts:ro
      - mosquitto-data:/mosquitto/data
      # named volume (not bind mount): keeps secrets out of the repo tree and
      # avoids Windows bind-mount permission warnings from mosquitto
      - mosquitto-passwd:/mosquitto/passwd

  server:
    build: ../server
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_URI: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD}
    ports:
      - "8080:8080" # direct API access for dev/verification
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      # alpine JRE image has busybox wget, no curl
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 10

  webui:
    build: ../webui
    volumes:
      # single source of truth for the SPA/proxy config; tweak without rebuild
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEBUI_PORT:-80}:80"
    depends_on:
      - server

  # dev-only build tool: `docker compose --profile tools run --rm mvn test`
  mvn:
    profiles: ["tools"]
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ../server:/workspace
      - m2cache:/root/.m2
    entrypoint: ["mvn"]
    command: ["test"]

volumes:
  pgdata:
  mosquitto-data:
  mosquitto-passwd:
  m2cache:
