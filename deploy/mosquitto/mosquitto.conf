# Phase 1: LAN listener, password auth, no TLS (TLS arrives in Phase 2), no ACL (Phase 3).
# Mosquitto 2.x binds localhost-only without an explicit listener; this line exposes 1883.
listener 1883
allow_anonymous false
password_file /mosquitto/passwd/passwd
persistence true
persistence_location /mosquitto/data/
log_dest stdout
