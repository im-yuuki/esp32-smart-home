# Minimal STANDALONE fallback — serves the SPA only.
#
# The real deployment config is the root nginx.conf (bind-mounted over this
# file by compose.yml); it adds the /api and /ws reverse proxies to the
# Spring server container. This fallback deliberately has no proxy_pass so the
# image also starts outside the compose network (where the `server` hostname
# would not resolve and nginx would refuse to boot).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history-mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
