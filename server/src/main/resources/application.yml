server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      timeout: ${SESSION_TIMEOUT:8h}

spring:
  application:
    name: smarthome-server
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/smarthome?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: ${DB_USER:smarthome}
    password: ${DB_PASSWORD:smarthome}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
springdoc:
  swagger-ui:
    url: /openapi.yaml
    csrf:
      enabled: true
smarthome:
  mqtt:
    uri: ${MQTT_URI:tcp://localhost:1883}
    username: ${MQTT_USERNAME:server}
    password: ${MQTT_PASSWORD:changeme}
    client-id: ${MQTT_CLIENT_ID:server-core}
  security:
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
