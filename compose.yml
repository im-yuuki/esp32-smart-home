services:
  mysql:
    image: mysql:8.4
    profiles: ["embedded-db"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      retries: 10

  mosquitto-init:
    image: eclipse-mosquitto:2
    user: root
    environment:
      MQTT_SERVER_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_SERVER_PASSWORD: ${MQTT_SERVER_PASSWORD}
    volumes:
      - ./init-mqtt-password.sh:/usr/local/bin/init-password.sh:ro
      - mosquitto-passwd:/mosquitto/passwd
    entrypoint: ["sh", "/usr/local/bin/init-password.sh"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883" # LAN-exposed, username/password auth, no TLS in Phase 1
    environment:
      MQTT_SERVER_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_SERVER_PASSWORD: ${MQTT_SERVER_PASSWORD}
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      # named volume (not bind mount): keeps secrets out of the repo tree and
      # avoids Windows bind-mount permission warnings from mosquitto
      - mosquitto-passwd:/mosquitto/passwd
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  server:
    build: ./server
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
      DB_USER: ${DB_USER:-${MYSQL_USER}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD}}
      MQTT_URI: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_SERVER_USERNAME}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-System Administrator}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      mosquitto:
        condition: service_started
    healthcheck:
      # alpine JRE image has busybox wget, no curl
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webui:
    build: ./webui
    volumes:
      # single source of truth for the SPA/proxy config; tweak without rebuild
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql-data:
  mosquitto-data:
  mosquitto-passwd:
